<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>模型评测台</title>
<style>
:root{--bg:#f6f4ee;--card:#fffefb;--ink:#262832;--muted:#70727f;--line:#e5e3de;--indigo:#4e46bb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"PingFang SC",sans-serif;font-size:14px}header{border-bottom:1px solid var(--line);padding:22px max(24px,calc((100vw - 1180px)/2));display:flex;justify-content:space-between;align-items:center;gap:16px}.brand{font-weight:750;font-size:18px;letter-spacing:1px}.brand span{display:inline-grid;place-items:center;background:var(--indigo);color:white;width:32px;height:32px;border-radius:10px;margin-right:12px;font-size:12px}header small{color:var(--muted)}main{max-width:1180px;margin:38px auto;padding:0 24px}.intro{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:26px}.eyebrow{color:var(--indigo);font-size:11px;letter-spacing:2px;font-weight:700}h1{font-size:32px;letter-spacing:-1px;margin:8px 0}p{color:var(--muted);line-height:1.7;margin:6px 0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px}.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 22px}.stat small{color:var(--muted)}.stat strong{display:block;font-size:29px;margin-top:8px;font-weight:650}.stat:first-child strong{color:var(--indigo)}.layout{display:grid;grid-template-columns:320px 1fr;gap:24px;align-items:start}.panel{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:22px}h2{font-size:17px;margin:0 0 18px}label{display:block;font-size:12px;font-weight:600;margin:15px 0 7px}input,select,textarea,button{font:inherit}input,select,textarea{width:100%;border:1px solid #dcdbe3;background:white;border-radius:8px;padding:10px 12px;color:var(--ink)}textarea{resize:vertical;min-height:130px;line-height:1.6}input:focus,textarea:focus,select:focus{outline:2px solid #c5bfff;outline-offset:1px}button{border:1px solid var(--line);background:white;border-radius:8px;padding:10px 15px;cursor:pointer;color:var(--ink);font-weight:550}button:hover{background:#eeecfa}button:focus-visible{outline:3px solid #aba3ff;outline-offset:2px}.primary{background:var(--indigo);border-color:var(--indigo);color:white}.primary:hover{background:#3f379f}.check{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:400}.check input{width:16px;height:16px;accent-color:var(--indigo)}.formactions{display:flex;gap:8px;margin-top:20px}.formactions .primary{flex:1}.hint{font-size:12px;margin-top:16px}.toolbar{display:flex;gap:10px;margin-bottom:16px}.toolbar input{flex:1;min-width:0}.toolbar select{width:130px}.listhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.listhead h2{margin:0}.listhead small{color:var(--muted)}.record{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:19px;margin-bottom:12px}.recordtop{display:flex;justify-content:space-between;gap:12px}.record h3{margin:0 0 8px;font-size:16px;overflow-wrap:anywhere}.tags{display:flex;gap:6px;flex-wrap:wrap}.tag{font-size:11px;padding:4px 8px;background:#f0eefb;color:var(--indigo);border-radius:5px;overflow-wrap:anywhere}.sample{background:#eeeee9;color:#77786f}.bad{background:#f9eae7;color:#a54436}.score{white-space:nowrap;font-size:23px;font-weight:650;color:var(--indigo)}.score small{font-size:12px;color:var(--muted);font-weight:400}.answer{white-space:pre-wrap;overflow-wrap:anywhere;color:#555763;line-height:1.8;margin:16px 0}.rowactions{border-top:1px solid var(--line);padding-top:12px;display:flex;gap:8px;justify-content:flex-end}.rowactions button{font-size:12px;padding:6px 10px}.danger{color:#a54436}.empty{padding:55px 20px;text-align:center;border:1px dashed #ccc8dc;border-radius:13px;color:var(--muted)}#status{min-height:22px;font-size:12px;color:var(--indigo);margin:12px 0}footer{color:var(--muted);font-size:11px;padding:28px 0}dialog{border:1px solid var(--line);border-radius:16px;padding:26px;max-width:90vw}dialog::backdrop{background:#26283266}dialog .formactions{justify-content:flex-end}@media(max-width:760px){main{margin-top:26px;padding:0 16px}header{padding:18px 16px}header small{max-width:130px;text-align:right}.intro{align-items:start}h1{font-size:27px}.stats{gap:8px}.stat{padding:14px 12px}.stat strong{font-size:25px}.layout{grid-template-columns:1fr}.toolbar{flex-wrap:wrap}.intro button{white-space:nowrap;padding:10px}.panel{padding:18px}}
</style>
</head>
<body>
<header><div class="brand"><span>ME</span>模型评测台</div><small id="storage">本地人工评测工作区</small></header>
<main>
<div class="intro"><div><div class="eyebrow">MODEL EVALUATION</div><h1>让每一次回答，有据可评。</h1><p>记录模型表现，沉淀值得改进的 Bad Case。</p></div><button id="export">导出 JSON</button></div>
<section class="stats" aria-label="当前筛选统计"><div class="stat"><small>平均分 · 当前筛选</small><strong id="average">—</strong></div><div class="stat"><small>评测记录 · 当前筛选</small><strong id="count">0</strong></div><div class="stat"><small>Bad Case · 当前筛选</small><strong id="badcount">0</strong></div></section>
<div class="layout">
<aside class="panel"><h2 id="formtitle">添加评测</h2><form id="form"><label for="title">用例标题</label><input id="title" required maxlength="100" placeholder="例如：多轮对话中的指令遵循"><label for="model">模型名称</label><input id="model" required maxlength="80" placeholder="输入模型或版本名称"><label for="answer">模型回答</label><textarea id="answer" required maxlength="20000" placeholder="粘贴需要人工评测的回答"></textarea><label for="score">人工评分</label><select id="score"><option value="5">5 分 · 优秀</option><option value="4">4 分 · 良好</option><option value="3">3 分 · 一般</option><option value="2">2 分 · 较差</option><option value="1">1 分 · 很差</option></select><label class="check"><input id="bad" type="checkbox">标记为 Bad Case</label><div class="formactions"><button class="primary" type="submit" id="save">保存评测</button><button type="button" id="cancel" hidden>取消编辑</button></div></form><p class="hint">评分由你人工判断。此页面不会生成回答或自动打分。</p></aside>
<section aria-label="评测记录"><div class="toolbar"><input id="search" type="search" aria-label="搜索评测" placeholder="搜索标题、模型或回答…"><select id="filter" aria-label="筛选评测"><option value="all">全部记录</option><option value="bad">仅 Bad Case</option><option value="good">非 Bad Case</option></select></div><div class="listhead"><h2>评测记录</h2><small>统计与导出跟随筛选</small></div><div id="list"></div></section>
</div><div id="status" role="status" aria-live="polite"></div><footer>本地工作区 / 首次打开载入 2 条示例数据；示例参与统计，可编辑或删除。</footer>
</main>
<dialog id="confirm"><h2>删除这条评测？</h2><p>删除后无法撤销。</p><div class="formactions"><button id="keep">保留</button><button id="remove" class="primary">确认删除</button></div></dialog>
<script>
const $=id=>document.getElementById(id),key='model-eval-v1';let editing=null,pending=null,memory=false;
const samples=[{id:'s1',title:'将长文本压缩为行动要点',model:'示例模型 A',answer:'1. 明确评测目标与评分标准。\n2. 收集模型回答并逐条评审。\n3. 汇总低分案例，跟踪改进。',score:5,bad:false,sample:true},{id:'s2',title:'信息不足时是否主动澄清',model:'示例模型 B',answer:'在缺少预算与使用场景的情况下，直接给出了唯一推荐方案。',score:2,bad:true,sample:true}];
let records=samples;
try{const raw=localStorage.getItem(key);if(raw!==null){const parsed=JSON.parse(raw);if(!Array.isArray(parsed)||!parsed.every(r=>r&&typeof r.id==='string'&&typeof r.title==='string'&&typeof r.model==='string'&&typeof r.answer==='string'&&Number.isInteger(r.score)&&r.score>=1&&r.score<=5&&typeof r.bad==='boolean'))throw Error();records=parsed}localStorage.setItem(key,JSON.stringify(records))}catch(e){memory=true}
function storageLabel(){$('storage').textContent=memory?'内存模式 · 刷新将丢失更改':'本地保存 · 当前浏览器'}storageLabel();
function persist(){try{if(!memory)localStorage.setItem(key,JSON.stringify(records))}catch(e){memory=true}storageLabel()}
function say(t){$('status').textContent=t+(memory?'（仅保存在本次页面内）':'')}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function visible(){const q=$('search').value.trim().toLowerCase(),f=$('filter').value;return records.filter(r=>(f==='all'||(f==='bad'?r.bad:!r.bad))&&[r.title,r.model,r.answer].some(v=>v.toLowerCase().includes(q)))}
function render(){const rows=visible();$('count').textContent=rows.length;$('average').textContent=rows.length?(rows.reduce((s,r)=>s+r.score,0)/rows.length).toFixed(2):'—';$('badcount').textContent=rows.filter(r=>r.bad).length;$('list').innerHTML=rows.length?rows.map(r=>'<article class="record"><div class="recordtop"><div><h3>'+esc(r.title)+'</h3><div class="tags"><span class="tag">'+esc(r.model)+'</span>'+(r.sample?'<span class="tag sample">示例数据</span>':'')+(r.bad?'<span class="tag bad">Bad Case</span>':'')+'</div></div><div class="score" aria-label="评分 '+r.score+' 分">'+r.score+' <small>/ 5</small></div></div><div class="answer">'+esc(r.answer)+'</div><div class="rowactions"><button data-action="edit" data-id="'+esc(r.id)+'">编辑</button><button class="danger" data-action="delete" data-id="'+esc(r.id)+'">删除</button></div></article>').join(''):'<div class="empty">'+(records.length?'没有匹配的评测，试试其他关键词或筛选条件。':'还没有评测。填写左侧表单，保存第一条记录。')+'</div>'}
function reset(){$('form').reset();editing=null;$('formtitle').textContent='添加评测';$('save').textContent='保存评测';$('cancel').hidden=true}
$('form').onsubmit=e=>{e.preventDefault();const title=$('title').value.trim(),model=$('model').value.trim(),answer=$('answer').value.trim();if(!title||!model||!answer){say('标题、模型名称和回答不能只包含空格。');return}const old=records.find(r=>r.id===editing),r={id:editing||Date.now().toString(36)+Math.random().toString(36).slice(2),title,model,answer,score:Number($('score').value),bad:$('bad').checked,sample:!!old?.sample};if(editing)records=records.map(x=>x.id===editing?r:x);else records.unshift(r);persist();reset();render();say('评测已保存。若未显示，请检查当前搜索与筛选。')};
$('cancel').onclick=reset;$('search').oninput=render;$('filter').onchange=render;
$('list').onclick=e=>{const b=e.target.closest('button[data-id]');if(!b)return;const r=records.find(x=>x.id===b.dataset.id);if(!r)return;if(b.dataset.action==='delete'){pending=r.id;$('confirm').showModal();return}editing=r.id;['title','model','answer','score'].forEach(k=>$(k).value=r[k]);$('bad').checked=r.bad;$('formtitle').textContent='编辑评测';$('save').textContent='保存修改';$('cancel').hidden=false;$('title').focus()};
$('keep').onclick=()=>{$('confirm').close();pending=null};$('remove').onclick=()=>{records=records.filter(r=>r.id!==pending);if(editing===pending)reset();persist();render();$('confirm').close();pending=null;say('评测已删除。')};
$('export').onclick=()=>{const rows=visible(),blob=new Blob([JSON.stringify({exportedAt:new Date().toISOString(),scope:'当前筛选',records:rows},null,2)],{type:'application/json;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='模型评测-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);say('已发起导出 '+rows.length+' 条记录，示例标记一并保留。')};render();
</script>
</body>
</html>
